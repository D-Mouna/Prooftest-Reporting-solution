[Service]
run_mode = background
auto_start = true
auto_start_trigger = logon
auto_start_delay_sec = 90
health_check_wait_sec = 120
; Always 1 — unified mode (API when up, else OPC). Former Case 2 removed; legacy 2 ignored.
deployment_case = 1
; Obsolete — ignored (always unified).
auto_detect_case = false

[Paths]
; Station root on C: — Reports, Results Structures, and Database live under this folder.
station_root = C:\HIMA Prooftest Reporting Tool
first_run_folder = C:\HIMA Prooftest Reporting Tool\HIMA Automated Prooftest Reports
; Runtime type catalogue (new *.csv = new Results / device type). Seeded from package on first start.
results_structures = C:\HIMA Prooftest Reporting Tool\Results Structures
; sql_templates =   ; optional design-reference path only — leave empty on deployed PCs
sql_templates =

[Database]
name = HIMA Automated Prooftest
server = localhost\SQLEXPRESS
driver = ODBC Driver 17 for SQL Server
trusted_connection = true
fallback_sqlite = true
sqlite_path = C:\HIMA Prooftest Reporting Tool\Database\prooftest.db

[SILworX]
programdata_root = C:\ProgramData
projects = Z:\Project\SILworX\OTS Demo\ProofTest-Reporting solution\ProofTest-Reporting solution - V16.0.0.E3
sync_triggers = silworx_session, code_generation, download, results_structures
api_host = 127.0.0.1
api_port = 51710
api_port_start = 51710
api_port_count = 10
api_plugin_port_start = 8400
api_plugin_port = 8400
api_plugin_name = prooftest_session_plugin
plugin_monitor_enabled = true
api_cert = C:\ProgramData\SILworX_v16.0.0 R3326\settings\api_cert.pem
api_client_cert_dir = C:\ProgramData\SILworX_v16.0.0 R3326\settings\api_client
api_timeout_sec = 120
api_open_timeout_sec = 600

[OPC]
discover_all_servers = true
server_filter = *X_OPC*;*HIMA*
poll_interval_sec = 1
device_list_poll_sec = 2
case1_sync_poll_sec = 2
template_poll_sec = 1
default_branch = OTS ProofTest
prooftest_branches = OTS ProofTest; OPC ProofTest

[Reports]
format = html
output_directory = C:\HIMA Prooftest Reporting Tool\HIMA Automated Prooftest Reports
local_mirror = C:\HIMA Prooftest Reporting Tool\HIMA Automated Prooftest Reports
; Seeded/generated under the Reports folder (auto-created for new Results types).
html_templates = C:\HIMA Prooftest Reporting Tool\HIMA Automated Prooftest Reports\Report Templates
filename_pattern = {Device_TAG}_{DateTime:yyyy-MM-dd_HH-mm-ss}
decimal_places = 3

[Web]
host = 127.0.0.1
port = 8080
auth_enabled = false
auth_token =
auth_localhost_bypass = true
; When auth_enabled=true, set auth_token and use ?token=... in the browser URL
; or send header X-Prooftest-Token. localhost bypass skips auth for 127.0.0.1 only.
